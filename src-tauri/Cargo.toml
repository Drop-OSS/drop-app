[package]
name = "drop-app"
version = "0.3.3"
# authors = ["Drop OSS"]
edition = "2024"
description = "The client application for the open-source, self-hosted game distribution platform Drop"

[workspace]
resolver = "3"
members = [
  "drop-database",
  "drop-downloads",
  "drop-errors",
  "drop-native-library",
  "drop-process",
  "drop-remote",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drop_app_lib"
# rustflags = ["-C", "target-feature=+aes,+sse2"]

[dependencies]
atomic-instant-full = "0.1.0"
bitcode = "0.6.6"
boxcar = "0.2.7"
bytes = "1.10.1"
cacache = "13.1.0"
chrono = "0.4.38"
deranged = "=0.4.0"
dirs = "6.0.0"
drop-database = { path = "./drop-database" }
drop-downloads = { path = "./drop-downloads" }
drop-errors = { path = "./drop-errors" }
drop-native-library = { path = "./drop-native-library" }
drop-process = { path = "./drop-process" }
drop-remote = { path = "./drop-remote" }
droplet-rs = "0.7.3"
filetime = "0.2.25"
futures-core = "0.3.31"
futures-lite = "2.6.0"
gethostname = "1.0.1"
hex = "0.4.3"
http = "1.1.0"
http-serde = "2.1.1"
humansize = "2.1.3"
known-folders = "1.2.0"
log = "0.4.22"
md5 = "0.7.0"
page_size = "0.6.0"
parking_lot = "0.12.3"
rand = "0.9.1"
rayon = "1.10.0"
regex = "1.11.1"
reqwest-middleware = "0.4.0"
reqwest-middleware-cache = "0.1.1"
reqwest-websocket = "0.5.0"
schemars = "0.8.22"
serde_json = "1"
serde_with = "3.12.0"
sha1 = "0.10.6"
shared_child = "1.0.1"
slice-deque = "0.3.0"
sysinfo = "0.36.1"
tar = "0.4.44"
tauri = { version = "2.7.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.4.0"
tauri-plugin-os = "2"
tauri-plugin-shell = "2.2.1"
tempfile = "3.19.1"
throttle_my_fn = "0.2.6"
tokio-util = { version = "0.7.16", features = ["io"] }
umu-wrapper-lib = "0.1.0"
url = "2.5.2"
urlencoding = "2.1.3"
walkdir = "2.5.0"
webbrowser = "1.0.2"
whoami = "1.6.0"
zstd = "0.13.3"
# tailscale = { path = "./tailscale" }

[dependencies.dynfmt]
version = "0.1.5"
features = ["curly"]

[dependencies.log4rs]
version = "1.3.0"
features = ["console_appender", "file_appender"]

[dependencies.reqwest]
version = "0.12.22"
default-features = false
features = [
  "blocking",
  "http2",
  "json",
  "native-tls-alpn",
  "rustls-tls",
  "rustls-tls-native-roots",
  "stream",
]

[dependencies.rustbreak]
version = "2"
features = ["other_errors"]  # You can also use "yaml_enc" or "bin_enc"

[dependencies.rustix]
version = "0.38.37"
features = ["fs"]

[dependencies.serde]
version = "1"
features = ["derive", "rc"]

[dependencies.tokio]
version = "1.40.0"
features = ["rt", "signal", "tokio-macros"]

[dependencies.uuid]
version = "1.10.0"
features = ["fast-rng", "macro-diagnostics", "v4"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

